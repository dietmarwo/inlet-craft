[workspace]
resolver = "2"
members = ["crates/inlet-craft", "crates/inlet-craft-cli", "crates/inlet-craft-py"]
default-members = ["crates/inlet-craft", "crates/inlet-craft-cli"]
exclude = ["vendor/fcmaes-core", "vendor/optimization-job-api"]
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
schemars = "0.8"
serde_path_to_error = "0.1"
libm = "0.2"
[profile.release]
lto = "thin"
codegen-units = 1
